<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Información Personal</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .profile-card {
            width: 100%;
            max-width: 850px;
            border: none;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .profile-header {
            background: linear-gradient(135deg, #bbcffd, #241e32);
            color: white;
            padding: 40px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            margin-bottom: 20px;
        }

        .info-item {
            padding: 18px;
            border-radius: 16px;
            background: #f8fafc;
            height: 100%;
            transition: 0.25s;
        }

        .info-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .info-icon {
            font-size: 24px;
            color: #9d9db8;
        }

        .info-label {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
        }

        .info-value {
            font-size: 17px;
            font-weight: 600;
            color: #0f172a;
        }

        .footer-text {
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="card profile-card">

    <div class="profile-header">


        <h1 class="fw-bold mb-2">
            <span th:text="${persona.nombre}"></span>
            <span th:text="${persona.apellido}"></span>
        </h1>

        <p class="mb-0 opacity-75">
            Información personal
        </p>

    </div>

    <div class="card-body p-4 p-md-5">

        <div class="row g-4">

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-person-badge"></i>
                    </div>

                    <div>
                        <div class="info-label">Nombre</div>
                        <div
                                class="info-value"
                                th:text="${persona.nombre}">
                        </div>
                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-person-vcard"></i>
                    </div>

                    <div>
                        <div class="info-label">Apellido</div>
                        <div
                                class="info-value"
                                th:text="${persona.apellido}">
                        </div>
                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-geo-alt-fill"></i>
                    </div>

                    <div>
                        <div class="info-label">Dirección</div>
                        <div
                                class="info-value"
                                th:text="${persona.direccion}">
                        </div>
                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-buildings-fill"></i>
                    </div>

                    <div>
                        <div class="info-label">Ciudad</div>
                        <div
                                class="info-value"
                                th:text="${persona.ciudad}">
                        </div>
                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-credit-card-2-front-fill"></i>
                    </div>

                    <div>
                        <div class="info-label">DNI</div>
                        <div
                                class="info-value"
                                th:text="${persona.dni}">
                        </div>
                    </div>

                </div>

            </div>

            <div class="col-md-6">

                <div class="info-item d-flex gap-3 align-items-center">

                    <div class="info-icon">
                        <i class="bi bi-heart-fill"></i>
                    </div>

                    <div>
                        <div class="info-label">Estado Civil</div>
                        <div
                                class="info-value"
                                th:text="${persona.estadoCivil}">
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <hr class="my-4">

        <div class="text-center footer-text">
            <i class="bi bi-code-slash me-1"></i>
            Aplicación desarrollada por Victor Santamaria
        </div>

    </div>

</div>

</body>
</html>
