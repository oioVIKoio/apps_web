server:
  port: 8084
spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/bd_pedido_dev?createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
empresa:
  ambiente: desarrollo
# Configuracion Eureka
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
