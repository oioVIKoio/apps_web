server:
  port: 9093
spring:
  datasource:
    url: jdbc:mariadb://${DB_HOST:servidor}:${DB_PORT:3306}/bd_recibo
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
servicios:
  cliente:
    url: ${CLIENTE_URL:http://cliente-service:9091}
  servicio:
    url: ${SERVICIO_URL:http://servicio-service:9092}
